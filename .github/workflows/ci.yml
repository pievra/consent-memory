name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Enable pnpm (version pinned in package.json)
        run: corepack enable
      - name: Install from the lockfile (install scripts stay off)
        run: pnpm install --frozen-lockfile
      - name: Credential pattern scan of tracked files
        run: pnpm check:secrets
      - name: Dependency audit (fails on high or critical)
        run: pnpm audit --audit-level high
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Inspect the built extension (permissions, no network or dynamic code APIs)
        run: pnpm check:bundle
      - name: Package the extension
        run: pnpm zip
      - name: Keep the packaged extension for manual testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-chrome
          path: .output/*-chrome.zip
          include-hidden-files: true # .output is a dot directory
          retention-days: 30
          if-no-files-found: error
      - name: Software bill of materials for what ships (CycloneDX)
        run: pnpm run sbom
      - name: Keep the bill of materials
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
          if-no-files-found: error
      - name: Install the test browser
        # No --with-deps: the hosted runner image already has the system libraries Chromium needs,
        # and installing them through apt made this step depend on the package mirror being up
        # (it failed once and hung once on 2026-11-11).
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Browser tests
        run: pnpm test:e2e
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  edge:
    # Runs the same browser tests in Microsoft Edge, which the hosted runner image ships.
    # A gate since 2026-11-11, when Edge 156 loaded the unpacked extension and passed all 38 tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Edge version
        run: microsoft-edge --version
      - name: Browser tests in Microsoft Edge
        run: CHROMIUM_PATH="$(command -v microsoft-edge)" pnpm test:e2e
